[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "csv2json-cli"
version = "0.1.0"
description = "CSV to JSON converter CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "HARSH" }]
keywords = ["csv", "json", "cli"]

[project.scripts]
csv2json = "csv2json.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/csv2json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
